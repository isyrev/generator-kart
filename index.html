<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Извлечение полей УЭЦН</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 17px;
    background: #1e1e1e;
    color: #d4d4d4;
    margin: 0;
    min-height: 100vh;
  }
  body { padding: 24px 36px 60px; }

  /* full-page drag overlay */
  #dragOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(14, 99, 156, 0.25);
    border: 3px dashed #0e639c;
    pointer-events: none;
  }
  #dragOverlay.show { display: flex; align-items: center; justify-content: center; }
  #dragOverlay span {
    font-size: 28px;
    color: #9cdcfe;
    background: #1e1e1e;
    padding: 20px 40px;
    border-radius: 10px;
    border: 2px solid #0e639c;
  }

  #dropZone {
    border: 2px dashed #555;
    border-radius: 12px;
    padding: 36px 24px;
    text-align: center;
    color: #aaa;
    margin-bottom: 28px;
    transition: border-color .2s, background .2s;
    cursor: pointer;
    user-select: none;
    font-size: 18px;
  }
  #dropZone:hover, #dropZone.dragover {
    border-color: #0e639c;
    background: #1a2a3a;
    color: #9cdcfe;
  }
  #dropZone .hint { font-size: 14px; margin-top: 8px; color: #666; }
  #status { margin-top: 10px; font-size: 15px; }
  #status.ok  { color: #4ec9b0; }
  #status.err { color: #f44747; }

  .block { margin-bottom: 22px; }
  .row3 {
    display: grid;
    grid-template-columns: 300px 360px 120px;
    gap: 0 18px;
    align-items: center;
    min-height: 36px;
    margin-bottom: 4px;
  }
  .row2 {
    display: grid;
    grid-template-columns: 300px 120px;
    gap: 0 18px;
    align-items: center;
    min-height: 36px;
    margin-bottom: 4px;
  }
  .row1 {
    display: grid;
    grid-template-columns: 300px;
    align-items: center;
    min-height: 36px;
    margin-bottom: 4px;
  }
  .cell {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 34px;
  }
  .val {
    color: #ce9178;
    background: #2d2d2d;
    padding: 5px 12px;
    border-radius: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
    font-size: 16px;
  }
  .val.empty { color: #555; background: transparent; padding: 5px 0; }
  .btn {
    background: #0e639c;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn:hover { background: #1177bb; }
  .btn.copied { background: #4ec9b0; }
  .static {
    color: #6a9955;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 340px;
    font-size: 16px;
  }
  .static.empty { color: #555; }
</style>
</head>
<body>

<div id="dragOverlay"><span>Отпустите файл .docx</span></div>

<div id="dropZone">
  Перетащите сюда файл .docx<br>
  <div class="hint">можно бросить в любое место страницы — или нажмите, чтобы выбрать</div>
  <div id="status"></div>
</div>
<input type="file" id="fileInput" accept=".docx" style="display:none">

<div id="output"></div>

<script>
function clean(s) {
  if (s == null) return '-';
  s = String(s).replace(/\u2000/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s || s === '-' || s === '*-*' || s === '*–*' || s === '…' ||
      s === '…..' || s === '….' || s === '—') return '-';
  return s;
}
function isEmpty(v) {
  v = clean(v);
  return !v || v === '-';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function copyVal(text, btn) {
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 1100);
  });
}
function cellCopy(v) {
  v = clean(v);
  if (isEmpty(v)) return '<span class="val empty">—</span>';
  var id = 'c' + Math.random().toString(36).slice(2, 9);
  return '<span class="cell"><span class="val" id="'+id+'">'+esc(v)+'</span>' +
         '<button class="btn" onclick="copyVal(document.getElementById(\''+id+'\').textContent,this)">Копировать</button></span>';
}
function cellStatic(v) {
  v = clean(v);
  if (isEmpty(v)) return '<span class="static empty">—</span>';
  return '<span class="static">'+esc(v)+'</span>';
}

function getText(node) {
  var t = '';
  function walk(n) {
    if (n.nodeType === 3) { t += n.nodeValue; return; }
    if (n.nodeType !== 1) return;
    var name = n.localName;
    if (name === 'tab') { t += '\t'; return; }
    if (name === 'br' || name === 'cr') { t += '\n'; return; }
    for (var i = 0; i < n.childNodes.length; i++) walk(n.childNodes[i]);
  }
  walk(node);
  return t;
}

function uniqueCells(arr) {
  var out = [], prev = null;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] !== prev) { out.push(arr[i]); prev = arr[i]; }
  }
  return out;
}

function stripLead(u) {
  var i = 0;
  while (i < u.length && u[i] === '') i++;
  return u.slice(i);
}

async function parseDocx(arrayBuffer) {
  var zip = await JSZip.loadAsync(arrayBuffer);
  var xmlStr = await zip.file('word/document.xml').async('string');
  var doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
  var NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

  var komplekt = '-';
  var paras = doc.getElementsByTagNameNS(NS, 'p');
  for (var pi = 0; pi < paras.length; pi++) {
    var txt = getText(paras[pi]);
    var m = txt.match(/Комплект\s*№\s*([^\s\u2000]+)/i);
    if (m) { komplekt = m[1].trim(); break; }
  }

  var tables = doc.getElementsByTagNameNS(NS, 'tbl');
  var best = null, bestScore = -1;
  for (var ti = 0; ti < tables.length; ti++) {
    var trs = tables[ti].getElementsByTagNameNS(NS, 'tr');
    var sample = '';
    for (var ri = 0; ri < Math.min(6, trs.length); ri++) sample += getText(trs[ri]);
    var score = trs.length +
      (sample.indexOf('1Я') >= 0 || sample.indexOf('Ян.с') >= 0 ? 100 : 0) +
      (sample.indexOf('ЭЦН') >= 0 ? 50 : 0) +
      (sample.indexOf('Марка') >= 0 ? 20 : 0);
    if (score > bestScore) { bestScore = score; best = tables[ti]; }
  }
  if (!best) throw new Error('Таблица комплектации не найдена');

  var trs = best.getElementsByTagNameNS(NS, 'tr');
  var tableData = [];
  var rawRows = [];
  for (var ri = 0; ri < trs.length; ri++) {
    var tcs = trs[ri].getElementsByTagNameNS(NS, 'tc');
    var cells = [];
    for (var ci = 0; ci < tcs.length; ci++) cells.push(getText(tcs[ci]).replace(/\r/g, '').trim());
    rawRows.push(cells);
    tableData.push(uniqueCells(cells));
  }
  return { komplekt: komplekt, tableData: tableData, rawRows: rawRows };
}

function extractFields(komplekt, T, rawRows) {
  var v = {};
  for (var i = 1; i <= 72; i++) v[i] = '-';
  v[29] = komplekt;

  function rowHas(i, re) {
    if (i < 0 || i >= T.length) return false;
    return re.test(T[i].join(' '));
  }
  function findRow(re, from) {
    from = from || 0;
    for (var i = from; i < T.length; i++) if (rowHas(i, re)) return i;
    return -1;
  }
  function S(i) { return stripLead(T[i] || []); }

  /* ── ЭЦН 1Я…7Я (до МЛГ / Расчёт / ЭД) ── */
  var mlgStop = T.length;
  for (var i = 0; i < T.length; i++) {
    var j = T[i].join(' ');
    if (/Модульная\s*ловильная|ловильная\s*головка|Расчет\s*мощности|Тип,\/мощ/i.test(j)) {
      mlgStop = i; break;
    }
  }
  var ecnRows = [];
  for (var i = 0; i < mlgStop; i++) {
    var s = S(i);
    var label = s[0] || '';
    if (/^\d*Ян\.?с?$/i.test(label) || /^\d+Я$/i.test(label)) {
      if (s.indexOf('Марка (Серия)') >= 0 || s.indexOf('№ секции') >= 0) continue;
      ecnRows.push(i);
    }
  }
  for (var k = 0; k < 7; k++) {
    var ri = ecnRows[k];
    if (ri === undefined) continue;
    var s = S(ri);
    if (s.length >= 10) {
      v[31 + k] = s[1];
      v[1 + k]  = s[7];
      v[38 + k] = s[12];
    } else {
      v[31 + k] = s[1] || '-';
      v[1 + k]  = '-';
      v[38 + k] = '-';
    }
  }

  /* ── МЛГ ── */
  var mlgRow = findRow(/Модульная\s*ловильная|ловильная\s*головка/i);
  if (mlgRow >= 0) {
    var s = S(mlgRow);
    var typ = (s[0] || '').replace(/Модульная\s*ловильная\s*головка\s*:\s*да\s*/i, '').trim();
    v[45] = typ || '-';
    v[8]  = (s[1] || '').replace(/^№\s*/, '').trim() || '-';
    v[46] = (s[2] || '').replace(/Приз\.?\s*:\s*/i, '').trim() || '-';
  }

  /* ── ЭД ── */
  var ed1Row = -1, ed2Row = -1;
  var edHdr = findRow(/Тип,\/мощ/);
  var searchFrom = edHdr >= 0 ? edHdr : 10;
  for (var i = searchFrom; i < T.length; i++) {
    var s = S(i);
    var label = s[0] || '';
    if ((label === '1Ян.с' || label === '1Я') && ed1Row < 0) {
      var joined = s.join(' ');
      if (/ЭДБ|ПЭД|-\d+В|_М\d|ЭД\d/i.test(joined) || (s[1] && /ЭД|В-\d/.test(s[1]))) {
        ed1Row = i;
      }
    }
    if (label === '2Я' && ed1Row >= 0 && ed2Row < 0 && i > ed1Row) ed2Row = i;
  }
  if (ed1Row < 0) {
    for (var i = 10; i < T.length; i++) {
      var s = S(i);
      if ((s[0] === '1Ян.с' || s[0] === '1Я') && s[1] && /ЭД|В/.test(s[1])) {
        ed1Row = i; break;
      }
    }
  }
  if (ed2Row < 0 && ed1Row >= 0) {
    for (var i = ed1Row + 1; i < ed1Row + 4 && i < T.length; i++) {
      if (S(i)[0] === '2Я') { ed2Row = i; break; }
    }
  }

  if (ed1Row >= 0) {
    var s = S(ed1Row);
    v[47] = s[1] || '-';
    v[30] = (s.length >= 9) ? (s[s.length - 1] || '-') : '-';
  }
  if (ed2Row >= 0) {
    var s = S(ed2Row).filter(function(t) { return t !== ''; });
    var num = '-', priz = '-';
    for (var i = 0; i < s.length; i++) {
      var t = s[i];
      if (/^[A-Za-zА-Яа-яЁёXxХх]\d{5,}/.test(t) || /^\d{8,}$/.test(t)) num = t;
      if (/^(Р|Н|К\/Р|К|Р\/Н)$/i.test(t)) priz = t;
    }
    v[9] = num;
    v[48] = priz;
    if (isEmpty(v[47])) {
      for (var i = 0; i < s.length; i++) {
        if (/ЭДБ|ПЭД|-\d+В/i.test(s[i])) { v[47] = s[i]; break; }
      }
    }
  }

  /* ── Датчик ── */
  var sensorRow = -1;
  for (var i = 0; i < T.length; i++) {
    var s = S(i);
    if (s[0] && /^\d{2}-\d{2}/.test(s[0])) { sensorRow = i; break; }
  }
  if (sensorRow < 0) {
    var hdr = findRow(/Погружной/i);
    if (hdr >= 0 && hdr + 1 < T.length) sensorRow = hdr + 1;
  }
  if (sensorRow >= 0) {
    var s = S(sensorRow);
    v[49] = s[0] || '-';
    v[10] = s[3] || '-';
    v[50] = s[4] || '-';
  }

  /* ── ППО [11] = № узла ──
     Варианты: "№ 12345", "№\t12345", "№   -", "№   [11]", отдельная ячейка с номером */
  var ppoRow = findRow(/ППО/);
  if (ppoRow < 0) {
    // иногда подпись в соседней строке
    for (var i = 0; i < T.length; i++) {
      if (/ППО\s*к|ППОк|пакетн/i.test(T[i].join(' '))) { ppoRow = i; break; }
    }
  }
  if (ppoRow >= 0) {
    var s = S(ppoRow);
    // также смотрим «сырые» ячейки строки (без unique), если переданы
    var raw = (rawRows && rawRows[ppoRow]) ? rawRows[ppoRow] : s;
    var ppoNum = '-';

    function takeNum(str) {
      if (!str) return null;
      var rest = String(str).replace(/^№\s*/, '').trim();
      rest = rest.replace(/^\[11\]$/, '').trim();
      if (!rest || rest === '-' || rest === '—' || rest === '[11]') return null;
      // отбросить плейсхолдеры вида [11]
      if (/^\[\d{1,3}\]$/.test(rest)) return null;
      return rest;
    }

    // 1) любая ячейка с «№…»
    var pool = s.concat(raw);
    for (var i = 0; i < pool.length; i++) {
      var cell = pool[i] || '';
      if (cell.indexOf('№') < 0) continue;
      // взять текст после последнего «№» в ячейке
      var idx = cell.lastIndexOf('№');
      var got = takeNum(cell.slice(idx));
      if (got) { ppoNum = got; break; }
    }

    // 2) ячейка, похожая на серийный номер
    if (ppoNum === '-') {
      for (var i = pool.length - 1; i >= 0; i--) {
        var t = (pool[i] || '').trim();
        if (!t || t === '-' || t === '—') continue;
        if (/^(ДА|НЕТ|да|нет|ППО)$/i.test(t)) continue;
        if (/^Ø/.test(t) || /ГЛУХ|ППО\s*к/i.test(t)) continue;
        if (/^\[?\d{1,3}\]?$/.test(t)) continue;
        if (/\d{5,}/.test(t) || /[A-Za-zА-Яа-яЁё]\d{4,}/.test(t)) {
          if (t.length > 25) continue;
          var got = takeNum(t) || t;
          if (got && got !== '-') { ppoNum = got; break; }
        }
      }
    }
    v[11] = ppoNum;
  }

  /* ── Г/С, ГЗ, МС ── */
  var gsRow = findRow(/Г\/С|Диспергатор|Газосеп/i);
  if (gsRow >= 0) {
    var s = S(gsRow);
    v[51] = s[1] || '-';
    v[12] = s[5] || '-';
    v[52] = s[7] || '-';
  }
  var gzRow = findRow(/Гидрозащита/i);
  if (gzRow >= 0) {
    var s = S(gzRow);
    v[53] = s[1] || '-';
    v[13] = s[5] || '-';
    v[54] = s[7] || '-';
  }
  var msRow = findRow(/Модуль\s*смещ/i);
  if (msRow >= 0) {
    var s = S(msRow);
    v[55] = s[1] || '-';
    v[14] = (s.length >= 6 ? s[5] : '-') || '-';
    v[56] = (s.length >= 8 ? s[7] : '-') || '-';
  }

  /* ── ОК + ШУ ── */
  var okRows = [];
  for (var i = 0; i < T.length; i++) {
    var s = S(i);
    if (s[0] === 'ОК' || s[0] === 'Ок') okRows.push(i);
  }
  function parseOk(ri) {
    var s = S(ri);
    return {
      type: s[1] || '-', num: s[2] || '-', priz: s[3] || '-',
      shuType: s[6] || '-', shuNum: s[7] || '-', shuPriz: s[8] || '-'
    };
  }
  if (okRows[0] !== undefined) {
    var o = parseOk(okRows[0]);
    v[15] = o.num; v[57] = o.type; v[59] = o.priz;
    v[17] = o.shuNum; v[61] = o.shuType; v[63] = o.shuPriz;
  }
  if (okRows[1] !== undefined) {
    var o = parseOk(okRows[1]);
    v[16] = o.num; v[58] = o.type; v[60] = o.priz;
    v[18] = o.shuNum; v[62] = o.shuType; v[64] = o.shuPriz;
  }

  /* ── Фильтр: [19] и [20] = только № узла (сепаратор / разобщитель) ──
     Шаблон: Тип (серия) | № узла | L | Ø
     Данные: "01-89-… \n РМ-…" | "[19]\n[20]" | "2,89" | "178 мм"
     Берём ячейку № узла и делим по переносу строки на два номера. */
  v[19] = '-';
  v[20] = '-';
  var filtRow = findRow(/Сепаратор|Разобщитель/i);
  if (filtRow >= 0) {
    var s = S(filtRow);
    // s after strip: [0]=СепараторРазобщитель, [1]=тип(ы), [2]=№узла, [3]=L, [4]=Ø…
    // № узла — ячейка, которая НЕ тип (не содержит КБ/РМ/серия-паттерн),
    // НЕ длина (только число с запятой), НЕ мм, НЕ «Сепаратор»
    var numCell = null;
    for (var i = 1; i < s.length; i++) {
      var t = s[i];
      if (!t || t === '-') continue;
      if (/мм/i.test(t)) continue;
      if (/Сепаратор|Разобщитель|Контейнер|Кол\.|Ø/i.test(t)) continue;
      // тип серии: есть буквы (КБ, РМ…) + цифры + дефисы (в т.ч. 01-89-30-КБ-89)
      if (/[A-Za-zА-Яа-яЁё]{2,}/.test(t) && /\d/.test(t) && t.indexOf('-') >= 0) continue;
      // длина вида 2,89 / 2‚89
      if (/^\d+[.,‚]\d+$/.test(t)) continue;
      // placeholder [19][20] or real numbers
      numCell = t;
      break;
    }
    if (numCell) {
      // split by newline or by ][  or by whitespace if two tokens
      var parts = numCell.split(/[\n\r]+/).map(function(x) { return x.trim(); }).filter(Boolean);
      if (parts.length < 2) {
        // try "[19][20]" glued
        var m = numCell.match(/\[?(\d+|-)\]?\s*\[?(\d+|-)\]?/);
        if (m) parts = [m[1], m[2]];
        else {
          var sp = numCell.trim().split(/\s+/).filter(Boolean);
          if (sp.length >= 2) parts = sp;
        }
      }
      // strip leftover brackets
      parts = parts.map(function(p) { return p.replace(/^\[|\]$/g, '').trim(); });
      if (parts[0] && parts[0] !== '19') v[19] = parts[0];
      else if (parts[0] === '19') v[19] = '-'; // still placeholder
      if (parts[1] && parts[1] !== '20') v[20] = parts[1];
      else if (parts[1] === '20') v[20] = '-';

      // if cell was just "-"
      if (numCell === '-' || numCell === '—') { v[19] = '-'; v[20] = '-'; }
      // if we only got placeholder text
      if (/^\[?19\]?$/.test(String(v[19]))) v[19] = '-';
      if (/^\[?20\]?$/.test(String(v[20]))) v[20] = '-';
    }
  }

  /* ── Протектолайзеры ── */
  var protLabels = [];
  for (var i = 0; i < T.length; i++) {
    var s = S(i);
    var lab = s[0] || '';
    if (lab === 'Г/З' || lab === 'МЛГ' || /^\d+-я$/.test(lab)) protLabels.push(i);
  }
  var protNumIdx  = [21, 22, 23, 24, 25, 26, 27, 28];
  var protPrizIdx = [65, 66, 67, 68, 69, 70, 71, 72];
  for (var k = 0; k < protLabels.length && k < 8; k++) {
    var s = S(protLabels[k]);
    v[protNumIdx[k]]  = s[2] || '-';
    v[protPrizIdx[k]] = s[3] || '-';
  }

  for (var k in v) v[k] = clean(v[k]);
  return v;
}

function render(v) {
  function c(n) { return cellCopy(v[n]); }
  function s(n) { return cellStatic(v[n]); }
  document.getElementById('output').innerHTML =
'<div class="block"><div class="row1">'+c(29)+'</div></div>'+
'<div class="block">'+
  '<div class="row3">'+c(1)+s(31)+s(38)+'</div>'+
  '<div class="row3">'+c(2)+s(32)+s(39)+'</div>'+
  '<div class="row3">'+c(3)+s(33)+s(40)+'</div>'+
  '<div class="row3">'+c(4)+s(34)+s(41)+'</div>'+
  '<div class="row3">'+c(5)+s(35)+s(42)+'</div>'+
  '<div class="row3">'+c(6)+s(36)+s(43)+'</div>'+
  '<div class="row3">'+c(7)+s(37)+s(44)+'</div>'+
  '<div class="row3">'+c(8)+s(45)+s(46)+'</div>'+
'</div>'+
'<div class="block">'+

/* ── file handling ── */
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
var statusEl = document.getElementById('status');
var overlay = document.getElementById('dragOverlay');
var dragCounter = 0;

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

async function handleFile(file) {
  if (!file) return;
  if (!/\.docx$/i.test(file.name)) {
    setStatus('Нужен файл .docx', 'err');
    return;
  }
  setStatus('Читаю ' + file.name + '…', '');
  try {
    var buf = await file.arrayBuffer();
    var parsed = await parseDocx(buf);
    var fields = extractFields(parsed.komplekt, parsed.tableData, parsed.rawRows);
    render(fields);
    setStatus('Готово: ' + file.name, 'ok');
  } catch (err) {
    setStatus('Ошибка: ' + err.message, 'err');
    console.error(err);
  }
}

dropZone.addEventListener('click', function() { fileInput.click(); });
fileInput.addEventListener('change', function(e) { handleFile(e.target.files[0]); });

/* full-page drag & drop */
window.addEventListener('dragenter', function(e) {
  e.preventDefault();
  dragCounter++;
  overlay.classList.add('show');
});
window.addEventListener('dragleave', function(e) {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('show'); }
});
window.addEventListener('dragover', function(e) {
  e.preventDefault();
});
window.addEventListener('drop', function(e) {
  e.preventDefault();
  dragCounter = 0;
  overlay.classList.remove('show');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});
</script>
