<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Извлечение № узлов</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="dragOverlay"><span>Отпустите файл .docx</span></div>

<header class="top">
  <div class="brand">УЭЦН  извлечение № узлов</div>
  <div class="controls">
    <label class="sel-label">Шаблон
      <select id="templateSelect"></select>
    </label>
    <label class="sel-label">Отображение
      <select id="layoutSelect"></select>
    </label>
  </div>
</header>

<div id="dropZone">
  Закинь сюда паспорт
  <div class="hint">можно бросить в любое место страницы</div>
  <div id="status"></div>
</div>
<input type="file" id="fileInput" accept=".docx" style="display:none">

<div id="output"></div>


<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
