<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Извлечение № узлов с ЭП</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="dragOverlay"><span>Ну... Отпускай уже!</span></div>

<header class="top">
  <div class="brand">Извлечение № узлов с ЭП</div>
  <div id="toolbar" class="toolbar hidden">
    <span id="fileName" class="file-name"></span>
    <label class="sel-label">Шаблон:
      <select id="modeSelect"></select>
    </label>
    <button class="btn-reset" onclick="resetFile()">Сброс</button>
  </div>
</header>

<div id="dropZone">
  <div class="drop-icon">📥</div>
  <div class="drop-title">Паспорт ЭП сюда</div>
  <div class="hint">принимаются ЭП только v.10</div>
  <div id="status"></div>
</div>
<input type="file" id="fileInput" accept=".docx" style="display:none">

<div id="output"></div>

<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
